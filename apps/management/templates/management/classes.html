{% extends "base_management.html" %}

{% block title %}
Classroom Management
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Classroom Management</h2>

</div>

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <form id="classroomForm">

            <input
                type="hidden"
                id="classroom_id"
            >

            <div class="row g-3">

                <div class="col-md-5">

                    <label class="form-label">
                        Classroom Name
                    </label>

                    <input
                        type="text"
                        id="classroom_name"
                        class="form-control"
                        placeholder="Enter classroom name"
                    >

                </div>

                <div class="col-md-5">

                    <label class="form-label">
                        Lesson
                    </label>

                    <select
                        id="classroom_lesson"
                        class="form-select"
                    >

                        {% for lesson in lessons %}

                        <option value="{{ lesson.id }}">
                            {{ lesson.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-2 d-flex align-items-end">

                    <button
                        type="submit"
                        id="classroom_button"
                        class="btn btn-primary w-100"
                    >
                        Add Classroom
                    </button>

                </div>

            </div>

            <div class="mt-3">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="resetClassroom()"
                >
                    Clear
                </button>

            </div>

        </form>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table
                class="table table-striped table-hover align-middle"
                id="classroomTable"
            >

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Lesson</th>
                        <th width="120">Edit</th>
                        <th width="120">Delete</th>

                    </tr>

                </thead>

                <tbody>

                {% for class in classes %}

                <tr id="row-{{ class.id }}">

                    <td>{{ class.id }}</td>

                    <td id="name-{{ class.id }}">
                        {{ class.name }}
                    </td>

                    <td id="lesson-{{ class.id }}">
                        {{ class.lesson.name }}
                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm"
                            onclick="
                                editClassroom(
                                    '{{ class.id }}',
                                    '{{ class.name }}',
                                    '{{ class.lesson.id }}'
                                )
                            "
                        >
                            Edit
                        </button>

                    </td>

                    <td>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="
                                deleteClassroom(
                                    '{{ class.id }}'
                                )
                            "
                        >
                            Delete
                        </button>

                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

// -------------------- EDIT --------------------

function editClassroom(
    id,
    name,
    lessonId
) {

    document.getElementById(
        "classroom_id"
    ).value = id

    document.getElementById(
        "classroom_name"
    ).value = name

    document.getElementById(
        "classroom_lesson"
    ).value = lessonId

    document.getElementById(
        "classroom_button"
    ).innerText = "Update Classroom"
}

// -------------------- RESET --------------------

function resetClassroom() {

    document.getElementById(
        "classroom_id"
    ).value = ""

    document.getElementById(
        "classroom_name"
    ).value = ""

    document.getElementById(
        "classroom_lesson"
    ).selectedIndex = 0

    document.getElementById(
        "classroom_button"
    ).innerText = "Add Classroom"
}

// -------------------- SAVE --------------------

document.getElementById(
    "classroomForm"
).addEventListener(
    "submit",
    function(e) {

        e.preventDefault()

        fetch(
            "/management/classes/",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded",

                    "X-CSRFToken":
                        getCookie(
                            "csrftoken"
                        )
                },

                body: new URLSearchParams({

                    classroom_id:
                        document.getElementById(
                            "classroom_id"
                        ).value,

                    name:
                        document.getElementById(
                            "classroom_name"
                        ).value,

                    lesson:
                        document.getElementById(
                            "classroom_lesson"
                        ).value
                })
            }
        )

        .then(
            res => res.json()
        )

        .then(
            data => {

                if (
                    data.status ===
                    "created"
                ) {

                    addRow(
                        data.id,
                        data.name,
                        data.lesson_id,
                        data.lesson_name
                    )
                }

                if (
                    data.status ===
                    "updated"
                ) {

                    document.getElementById(
                        "name-" +
                        data.id
                    ).innerText =
                        data.name

                    document.getElementById(
                        "lesson-" +
                        data.id
                    ).innerText =
                        data.lesson_name
                }

                resetClassroom()
            }
        )
    }
)

// -------------------- DELETE --------------------

function deleteClassroom(id) {

    fetch(
        `/management/classes/delete/${id}/`,
        {

            method: "POST",

            headers: {

                "X-CSRFToken":
                    getCookie(
                        "csrftoken"
                    )
            }
        }
    )

    .then(
        res => res.json()
    )

    .then(
        data => {

            document.getElementById(
                "row-" + id
            ).remove()
        }
    )
}

// -------------------- ADD ROW --------------------

function addRow(
    id,
    name,
    lessonId,
    lessonName
) {

    let table =
        document.getElementById(
            "classroomTable"
        )

    let row =
        table.insertRow()

    row.id =
        "row-" + id

    row.innerHTML = `

        <td>${id}</td>

        <td id="name-${id}">
            ${name}
        </td>

        <td id="lesson-${id}">
            ${lessonName}
        </td>

        <td>

            <button
		class="btn btn-warning btn-sm"
                onclick="
                    editClassroom(
                        '${id}',
                        '${name}',
                        '${lessonId}'
                    )
                "
            >
                Edit
            </button>

        </td>

        <td>

            <button
		class="btn btn-danger btn-sm"
                onclick="
                    deleteClassroom(
                        '${id}'
                    )
                "
            >
                Delete
            </button>

        </td>
    `
}

// -------------------- CSRF --------------------

function getCookie(name) {

    let cookieValue = null

    if (
        document.cookie &&
        document.cookie !== ""
    ) {

        const cookies =
            document.cookie.split(
                ";"
            )

        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =
                cookies[i].trim()

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                (
                    name + "="
                )
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    )

                break
            }
        }
    }

    return cookieValue
}

</script>

{% endblock %}
