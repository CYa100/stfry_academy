{% extends "base_management.html" %}

{% block title %}Dorm Management{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Dorm Management</h2>
    </div>

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <h5 class="mb-0">Add / Update Dorm</h5>
        </div>

        <div class="card-body">

            <form id="dormForm">

                {% csrf_token %}

                <input
                    type="hidden"
                    id="dorm_id"
                >

                <div class="row g-3">

                    <div class="col-md-5">

                        <input
                            type="text"
                            id="dorm_name"
                            class="form-control"
                            placeholder="Dorm Name"
                        >

                    </div>

                    <div class="col-md-3">

                        <input
                            type="number"
                            id="dorm_capacity"
                            class="form-control"
                            placeholder="Capacity"
                        >

                    </div>

                    <div class="col-md-4">

                        <button
                            type="submit"
                            id="dorm_button"
                            class="btn btn-primary"
                        >
                            Add Dorm
                        </button>

                        <button
                            type="button"
                            onclick="resetDorm()"
                            class="btn btn-secondary"
                        >
                            Clear
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">Dorm List</h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-striped table-hover align-middle"
                    id="dormTable"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Capacity</th>
                            <th width="120">Edit</th>
                            <th width="120">Delete</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for dorm in dorms %}

                        <tr id="row-{{ dorm.id }}">

                            <td>{{ dorm.id }}</td>

                            <td id="name-{{ dorm.id }}">
                                {{ dorm.name }}
                            </td>

                            <td id="capacity-{{ dorm.id }}">
                                {{ dorm.capacity }}
                            </td>

                            <td>

                                <button
                                    class="btn btn-warning btn-sm"
                                    onclick="editDorm(
                                        '{{ dorm.id }}',
                                        '{{ dorm.name }}',
                                        '{{ dorm.capacity }}'
                                    )"
                                >
                                    Edit
                                </button>

                            </td>

                            <td>

                                <button
                                    class="btn btn-danger btn-sm"
                                    onclick="deleteDorm('{{ dorm.id }}')"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

// -------------------- EDIT --------------------

function editDorm(id, name, capacity) {

    document.getElementById("dorm_id").value = id

    document.getElementById("dorm_name").value = name

    document.getElementById("dorm_capacity").value = capacity

    document.getElementById("dorm_button").innerText =
        "Update Dorm"

}

// -------------------- RESET --------------------

function resetDorm() {

    document.getElementById("dorm_id").value = ""

    document.getElementById("dorm_name").value = ""

    document.getElementById("dorm_capacity").value = ""

    document.getElementById("dorm_button").innerText =
        "Add Dorm"

}

// -------------------- SAVE --------------------

document
.getElementById("dormForm")
.addEventListener("submit", function(e) {

    e.preventDefault()

    fetch("/management/dorms/", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/x-www-form-urlencoded",

            "X-CSRFToken":
                getCookie("csrftoken")

        },

        body: new URLSearchParams({

            dorm_id:
                document.getElementById("dorm_id").value,

            name:
                document.getElementById("dorm_name").value,

            capacity:
                document.getElementById("dorm_capacity").value

        })

    })

    .then(res => res.json())

    .then(data => {

        if (data.status === "created") {

            addRow(
                data.id,
                data.name,
                data.capacity
            )

        }

        if (data.status === "updated") {

            document.getElementById(
                "name-" + data.id
            ).innerText = data.name

            document.getElementById(
                "capacity-" + data.id
            ).innerText = data.capacity

        }

        resetDorm()

    })

})

// -------------------- DELETE --------------------

function deleteDorm(id) {

    fetch(`/management/dorms/delete/${id}/`, {

        method: "POST",

        headers: {

            "X-CSRFToken":
                getCookie("csrftoken")

        }

    })

    .then(res => res.json())

    .then(data => {

        document
        .getElementById("row-" + id)
        .remove()

    })

}

// -------------------- ADD ROW --------------------

function addRow(id, name, capacity) {

    let table =
        document.getElementById("dormTable")

    let row = table.insertRow()

    row.id = "row-" + id

    row.innerHTML = `

        <td>${id}</td>

        <td id="name-${id}">
            ${name}
        </td>

        <td id="capacity-${id}">
            ${capacity}
        </td>

        <td>

            <button
		class="btn btn-warning btn-sm"
                onclick="editDorm(
                    '${id}',
                    '${name}',
                    '${capacity}'
                )"
            >
                Edit
            </button>

        </td>

        <td>

            <button
		class="btn btn-danger btn-sm"
                onclick="deleteDorm('${id}')"
            >
                Delete
            </button>

        </td>

    `
}

// -------------------- CSRF --------------------

function getCookie(name) {

    let cookieValue = null

    if (document.cookie &&
        document.cookie !== "") {

        const cookies =
            document.cookie.split(";")

        for (let i = 0; i < cookies.length; i++) {

            const cookie =
                cookies[i].trim()

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) === (name + "=")
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    )

                break

            }

        }

    }

    return cookieValue

}

</script>

{% endblock %}
