{% extends "base_management.html" %}

{% block content %}

<h1 class="mb-4">Lesson Management</h1>

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <form id="lessonForm" class="row g-3">

            <input
                type="hidden"
                id="lesson_id"
            >

            <div class="col-md-5">

                <input
                    type="text"
                    id="lesson_name"
                    class="form-control"
                    placeholder="Lesson Name"
                >

            </div>

            <div class="col-md-4">

                <select
                    id="lesson_faculty"
                    class="form-select"
                >

                    {% for faculty in faculties %}

                    <option value="{{ faculty.id }}">
                        {{ faculty.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="col-md-3 d-flex gap-2">

                <button
                    type="submit"
                    id="lesson_button"
                    class="btn btn-primary flex-fill"
                >
                    Add Lesson
                </button>

                <button
                    type="button"
                    onclick="resetLesson()"
                    class="btn btn-secondary flex-fill"
                >
                    Clear
                </button>

            </div>

        </form>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table
                class="table table-striped table-hover align-middle"
                id="lessonTable"
            >

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Faculty</th>
                        <th>Edit</th>
                        <th>Delete</th>

                    </tr>

                </thead>

                <tbody>

                {% for lesson in lessons %}

                <tr id="row-{{ lesson.id }}">

                    <td>{{ lesson.id }}</td>

                    <td id="name-{{ lesson.id }}">
                        {{ lesson.name }}
                    </td>

                    <td id="faculty-{{ lesson.id }}">
                        {{ lesson.faculty.name }}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn btn-warning btn-sm"
                            onclick="
                                editLesson(
                                    '{{ lesson.id }}',
                                    '{{ lesson.name }}',
                                    '{{ lesson.faculty.id }}'
                                )
                            "
                        >
                            Edit
                        </button>

                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn btn-danger btn-sm"
                            onclick="
                                deleteLesson(
                                    '{{ lesson.id }}'
                                )
                            "
                        >
                            Delete
                        </button>

                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

// -------------------- EDIT --------------------

function editLesson(
    id,
    name,
    facultyId
) {

    document.getElementById(
        "lesson_id"
    ).value = id

    document.getElementById(
        "lesson_name"
    ).value = name

    document.getElementById(
        "lesson_faculty"
    ).value = facultyId

    document.getElementById(
        "lesson_button"
    ).innerText = "Update Lesson"
}

// -------------------- RESET --------------------

function resetLesson() {

    document.getElementById(
        "lesson_id"
    ).value = ""

    document.getElementById(
        "lesson_name"
    ).value = ""

    document.getElementById(
        "lesson_faculty"
    ).selectedIndex = 0

    document.getElementById(
        "lesson_button"
    ).innerText = "Add Lesson"
}

// -------------------- SAVE --------------------

document.getElementById(
    "lessonForm"
).addEventListener(
    "submit",
    function(e) {

        e.preventDefault()

        fetch(
            "/management/lessons/",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded",

                    "X-CSRFToken":
                        getCookie(
                            "csrftoken"
                        )
                },

                body: new URLSearchParams({

                    lesson_id:
                        document.getElementById(
                            "lesson_id"
                        ).value,

                    name:
                        document.getElementById(
                            "lesson_name"
                        ).value,

                    faculty:
                        document.getElementById(
                            "lesson_faculty"
                        ).value
                })
            }
        )

        .then(
            res => res.json()
        )

        .then(
            data => {

                if (
                    data.status ===
                    "created"
                ) {

                    addRow(
                        data.id,
                        data.name,
                        data.faculty_id,
                        data.faculty_name
                    )
                }

                if (
                    data.status ===
                    "updated"
                ) {

                    document.getElementById(
                        "name-" +
                        data.id
                    ).innerText =
                        data.name

                    document.getElementById(
                        "faculty-" +
                        data.id
                    ).innerText =
                        data.faculty_name
                }

                resetLesson()
            }
        )
    }
)

// -------------------- DELETE --------------------

function deleteLesson(id) {

    fetch(
        `/management/lessons/delete/${id}/`,
        {

            method: "POST",

            headers: {

                "X-CSRFToken":
                    getCookie(
                        "csrftoken"
                    )
            }
        }
    )

    .then(
        res => res.json()
    )

    .then(
        data => {

            document.getElementById(
                "row-" + id
            ).remove()
        }
    )
}

// -------------------- ADD ROW --------------------

function addRow(
    id,
    name,
    facultyId,
    facultyName
) {

    let table =
        document.getElementById(
            "lessonTable"
        )

    let row =
        table.insertRow()

    row.id =
        "row-" + id

    row.innerHTML = `

        <td>${id}</td>

        <td id="name-${id}">
            ${name}
        </td>

        <td id="faculty-${id}">
            ${facultyName}
        </td>

        <td>

            <button
		class="btn btn-warning btn-sm"
                onclick="
                    editLesson(
                        '${id}',
                        '${name}',
                        '${facultyId}'
                    )
                "
            >
                Edit
            </button>

        </td>

        <td>

            <button
		class="btn btn-danger btn-sm"
                onclick="
                    deleteLesson(
                        '${id}'
                    )
                "
            >
                Delete
            </button>

        </td>
    `
}

// -------------------- CSRF --------------------

function getCookie(name) {

    let cookieValue = null

    if (
        document.cookie &&
        document.cookie !== ""
    ) {

        const cookies =
            document.cookie.split(
                ";"
            )

        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =
                cookies[i].trim()

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                (
                    name + "="
                )
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    )

                break
            }
        }
    }

    return cookieValue
}

</script>

{% endblock %}
