{% extends "base_management.html" %}

{% block content %}

<h1 class="mb-4">Faculty Management</h1>

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <form id="facultyForm" class="row g-3">

            <input
                type="hidden"
                id="faculty_id"
            >

            <div class="col-md-9">

                <input
                    type="text"
                    id="faculty_name"
                    class="form-control"
                    placeholder="Faculty Name"
                >

            </div>

            <div class="col-md-3 d-flex gap-2">

                <button
                    type="submit"
                    id="saveBtn"
                    class="btn btn-primary flex-fill"
                >
                    Save
                </button>

                <button
                    type="button"
                    onclick="resetForm()"
                    class="btn btn-secondary flex-fill"
                >
                    Clear
                </button>

            </div>

        </form>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="table-responsive">

            <table
                class="table table-striped table-hover align-middle"
                id="facultyTable"
            >

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Edit</th>
                        <th>Delete</th>

                    </tr>

                </thead>

                <tbody>

                {% for faculty in faculties %}

                <tr id="row-{{ faculty.id }}">

                    <td>{{ faculty.id }}</td>

                    <td id="name-{{ faculty.id }}">
                        {{ faculty.name }}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn btn-warning btn-sm"
                            onclick="
                                editFaculty(
                                    '{{ faculty.id }}',
                                    '{{ faculty.name }}'
                                )
                            "
                        >
                            Edit
                        </button>

                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn btn-danger btn-sm"
                            onclick="
                                deleteFaculty(
                                    '{{ faculty.id }}'
                                )
                            "
                        >
                            Delete
                        </button>

                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

// -------------------- EDIT --------------------
function editFaculty(id, name) {

    document.getElementById("faculty_id").value = id
    document.getElementById("faculty_name").value = name
    document.getElementById("saveBtn").innerText = "Update"

}

// -------------------- RESET --------------------
function resetForm() {

    document.getElementById("faculty_id").value = ""
    document.getElementById("faculty_name").value = ""
    document.getElementById("saveBtn").innerText = "Save"

}

// -------------------- SAVE (CREATE + UPDATE) --------------------
document.getElementById("facultyForm").addEventListener("submit", function(e) {

    e.preventDefault()

    fetch("/management/faculties/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: new URLSearchParams({
            faculty_id: document.getElementById("faculty_id").value,
            name: document.getElementById("faculty_name").value
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "created") {

            addRow(data.id, data.name)

        }

        if (data.status === "updated") {

            document.getElementById("name-" + data.id).innerText = data.name

        }

        resetForm()

    })

})

// -------------------- DELETE --------------------
function deleteFaculty(id) {

    fetch(`/management/faculties/delete/${id}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": getCookie("csrftoken")
        }
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("row-" + id).remove()

    })

}

// -------------------- ADD ROW WITHOUT RELOAD --------------------
function addRow(id, name) {

    let table = document.getElementById("facultyTable")

    let row = table.insertRow()

    row.id = "row-" + id

    row.innerHTML = `
        <td>${id}</td>
        <td id="name-${id}">${name}</td>
        <td><button type="button" class="btn btn-warning btn-sm" onclick="editFaculty('${id}','${name}')">Edit</button></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="deleteFaculty('${id}')">Delete</button></td>
    `
}

// -------------------- CSRF --------------------
function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }

        }

    }

    return cookieValue;

}

</script>

{% endblock %}
